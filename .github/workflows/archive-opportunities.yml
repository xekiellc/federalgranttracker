name: Archive Closed Opportunities

on:
  schedule:
    # Once a day — status transitions aren't time-sensitive, unlike the
    # data syncs. Runs at 08:00 UTC.
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - 'usaspending-sync-worker/archive-opportunities.cjs'
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Close and archive opportunities
        working-directory: usaspending-sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 27782793dc31aeede4bbbf95f2c26adc
        run: node archive-opportunities.cjs
